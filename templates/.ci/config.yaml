# flutter-ci project config — schema: https://github.com/nividata-consultancy/flutter-ci/blob/v1/docs/CONFIG_REFERENCE.md
version: 1

app:
  name: MyApp                         # used in artifact names and notifications
  flutter_version_file: .fvmrc        # .fvmrc ({"flutter": "X.Y.Z"}) or pubspec.yaml (environment.flutter)
  java_version: "17"
  # prod_branches: [main]             # optional: only allow prod tags on these branches
  build_number_offset: 0              # Android versionCode = run number + offset
  run_tests: true
  run_analyze: false
  obfuscate: false                    # --obfuscate --split-debug-info
  android_package_name: com.example.myapp   # needed for the playstore destination
  # github_release: { enabled: true, attach_artifacts: false }

environments:
  uat:
    dart_define_file: env/uat.json    # optional; or the DART_DEFINES_UAT_JSON secret
    android:
      # flavor: uat                   # only if android/app/build.gradle defines productFlavors
      # target: lib/main.dart
      artifacts: [aab, apk]           # aab | apk
      destinations:                   # remove the lines you don't need
        playstore: { track: internal }          # Play internal testing
        # firebase:  { groups: "qa-team" }      # Firebase App Distribution (+ tag message as release notes)
        # drive:     { folder_id: "SHARED_DRIVE_FOLDER_ID" }
    ios:                              # iOS always goes to TestFlight (Xcode Cloud), nowhere else
      display_name: "MyApp UAT"
      app_icon: AppIcon-UAT
      # google_service_info: ios/config/uat/GoogleService-Info.plist
      # build_settings: { SOME_SETTING: value }

  prod:
    dart_define_file: env/prod.json
    android:
      artifacts: [aab]
      destinations:
        playstore: { track: internal, production: true }   # internal testing + DRAFT production release
        # firebase:  { groups: "qa-team" }
        # drive:     { folder_id: "SHARED_DRIVE_FOLDER_ID" }
    ios:
      display_name: "MyApp"
      app_icon: AppIcon
      # google_service_info: ios/config/prod/GoogleService-Info.plist
