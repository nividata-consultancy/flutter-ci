name: flutter-ci / distribute-playstore
description: >
  Upload an AAB to a Google Play testing track (e.g. internal testing) and,
  optionally, add the same build to the production track as a DRAFT release.
  The app's very first upload must be done manually in Play Console.
inputs:
  service-account-json:
    description: PLAY_SERVICE_ACCOUNT_JSON (plain JSON)
    required: true
  package-name:
    description: Android application ID
    required: true
  aab:
    description: Path to the .aab
    required: true
  track:
    description: Testing track (internal, alpha, beta or a custom closed track)
    default: internal
  status:
    description: completed | draft (draft is required while the app itself is still a draft in Play Console)
    default: completed
  release-name:
    description: Release name shown in Play Console
    required: true
  version-code:
    description: versionCode of the AAB (used for the production draft)
    required: true
  production:
    description: '"true" to also create a draft release on the production track'
    default: "false"
  mapping-file:
    description: R8 mapping.txt to upload for deobfuscation
    default: ""
  working-directory:
    description: App root (paths are relative to it)
    default: .
runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        SA: ${{ inputs.service-account-json }}
        TRACK: ${{ inputs.track }}
        LOG_SH: ${{ github.action_path }}/../../scripts/common/log.sh
      run: |
        source "$LOG_SH"
        [[ -n "$SA" ]] || die "PLAY_SERVICE_ACCOUNT_JSON is not set." "SECRETS.md#google-play"
        [[ "$TRACK" != "production" ]] || die "Use 'production: true' (draft) instead of track: production." "CONFIG_REFERENCE.md#destinations"

    - name: Upload to Google Play (${{ inputs.track }})
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ inputs.service-account-json }}
        packageName: ${{ inputs.package-name }}
        releaseFiles: ${{ inputs.working-directory }}/${{ inputs.aab }}
        releaseName: ${{ inputs.release-name }}
        tracks: ${{ inputs.track }}
        status: ${{ inputs.status }}
        mappingFile: ${{ inputs.mapping-file != '' && format('{0}/{1}', inputs.working-directory, inputs.mapping-file) || '' }}

    - name: Draft release on production
      if: inputs.production == 'true'
      shell: bash
      env:
        PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.service-account-json }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        VERSION_CODE: ${{ inputs.version-code }}
        RELEASE_NAME: ${{ inputs.release-name }}
      run: '"$GITHUB_ACTION_PATH/../../scripts/android/play_production_draft.sh"'
