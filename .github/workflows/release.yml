# Releases flutter-ci itself. Push a tag vX.Y.Z (after updating CHANGELOG.md)
# and this workflow creates the GitHub Release and moves the major tag
# (v1 -> newest v1.x.y) that all apps track.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and move the major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tag, branch and CHANGELOG
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Bad tag $TAG"; exit 1; }
          major="v${BASH_REMATCH[1]}"
          version="${TAG#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }
          # Never move the major tag backwards.
          latest="$(git tag -l "$major.*.*" | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)"
          [[ "$latest" == "$TAG" ]] || { echo "::error::$TAG is not the newest $major.x.y ($latest)"; exit 1; }
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Move ${{ steps.check.outputs.major }} to ${{ github.ref_name }}
        env:
          MAJOR: ${{ steps.check.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
