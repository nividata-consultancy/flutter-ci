# Config used by flutter-ci's self-test (dry-run builds only).
version: 1
app:
  name: FlutterCIExample
  flutter_version_file: .fvmrc
  java_version: "17"
  run_tests: true
  run_analyze: true
  android_package_name: com.example.flutter_ci_example

environments:
  uat:
    build_args: ["--dart-define-from-file=env/uat.json"]
    android:
      destinations:
        playstore: { enabled: true, tracks: [internal] }
    ios:
      display_name: "Example UAT"
      app_icon: AppIcon-UAT
  prod:
    build_args: ["--dart-define-from-file=env/prod.json"]
    android:
      destinations:
        playstore: { enabled: true, tracks: [internal] }
    ios:
      display_name: "Example"
      app_icon: AppIcon
