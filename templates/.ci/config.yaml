# flutter-ci project config — schema: https://github.com/nividata-consultancy/flutter-ci/blob/v1/docs/CONFIG_REFERENCE.md
version: 1

app:
  name: MyApp                         # used in artifact names and notifications
  flutter_version_file: .fvmrc        # .fvmrc ({"flutter": "X.Y.Z"}) or pubspec.yaml (environment.flutter)
  java_version: "17"                  # same as your Mac: `flutter doctor -v` → Android toolchain → Java version
  # prod_branches: [main]             # optional: only allow prod tags on these branches
  build_number_offset: 0              # Android versionCode = run number + offset
  run_tests: true
  run_analyze: false
  obfuscate: false                    # --obfuscate --split-debug-info
  android_package_name: com.example.myapp   # needed for the playstore destination
  # github_release: { enabled: true, attach_artifacts: false }

environments:
  uat:
    # dart_define_file: env/uat.json  # optional: --dart-define-from-file (or the DART_DEFINES_UAT_JSON secret)
    android:
      enabled: true                   # false = UAT tags build nothing on Android
      # flavor: uat                   # only if android/app/build.gradle defines productFlavors
      # target: lib/main.dart
      destinations:                   # builds go only where enabled: true
        playstore: { enabled: true,  tracks: [internal] }                # Play internal testing
        firebase:  { enabled: false, groups: "qa-team" }                 # Firebase App Distribution (tag message = release notes)
        drive:     { enabled: false, folder_id: "SHARED_DRIVE_FOLDER_ID" }  # Google Drive folder ID
    ios:                              # iOS always goes to TestFlight (Xcode Cloud), nowhere else
      enabled: true                   # false = UAT tags stop the iOS build at once (shows as failed in Xcode Cloud)
      # Optional, needs the one-time Xcode setup in docs/IOS_SETUP.md:
      # display_name: "MyApp UAT"
      # app_icon: AppIcon-UAT
      # google_service_info: ios/config/uat/GoogleService-Info.plist
      # build_settings: { SOME_SETTING: value }

  prod:
    # dart_define_file: env/prod.json
    android:
      enabled: true
      destinations:
        # tracks: [internal] = internal only, [production] = production only (draft),
        #         [internal, production] = both. Production is always a DRAFT.
        playstore: { enabled: true,  tracks: [internal] }
        firebase:  { enabled: false, groups: "qa-team" }
        drive:     { enabled: false, folder_id: "SHARED_DRIVE_FOLDER_ID" }
    ios:
      enabled: true
      # display_name: "MyApp"
      # app_icon: AppIcon
      # google_service_info: ios/config/prod/GoogleService-Info.plist
