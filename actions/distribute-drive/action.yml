name: flutter-ci / distribute-drive
description: >
  Upload files to a Google Drive folder, either as your own Google account
  (OAuth refresh token, My Drive) or with a service account (Shared Drive only,
  because service accounts have no storage of their own).
inputs:
  service-account-json:
    description: GDRIVE_SERVICE_ACCOUNT_JSON (plain JSON); Shared Drive folders only
    default: ""
  oauth-client-id:
    description: GDRIVE_OAUTH_CLIENT_ID (upload as your own account)
    default: ""
  oauth-client-secret:
    description: GDRIVE_OAUTH_CLIENT_SECRET
    default: ""
  oauth-refresh-token:
    description: GDRIVE_OAUTH_REFRESH_TOKEN
    default: ""
  folder-id:
    description: Google Drive folder ID (from the folder URL)
    required: true
  files:
    description: Newline-separated file paths
    required: true
  working-directory:
    description: App root
    default: .
outputs:
  link:
    description: Link to the last uploaded file
    value: ${{ steps.upload.outputs.link }}
runs:
  using: composite
  steps:
    - name: Upload to Google Drive
      id: upload
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ inputs.service-account-json }}
        GDRIVE_OAUTH_CLIENT_ID: ${{ inputs.oauth-client-id }}
        GDRIVE_OAUTH_CLIENT_SECRET: ${{ inputs.oauth-client-secret }}
        GDRIVE_OAUTH_REFRESH_TOKEN: ${{ inputs.oauth-refresh-token }}
        FOLDER_ID: ${{ inputs.folder-id }}
        FILES: ${{ inputs.files }}
        SCRIPT: ${{ github.action_path }}/../../scripts/common/gdrive_upload.sh
      run: |
        link=""
        while IFS= read -r f; do
          [[ -z "$f" ]] && continue
          link="$("$SCRIPT" "$f" "$FOLDER_ID")"
          echo "Uploaded $f: $link"
        done <<<"$FILES"
        echo "link=$link" >>"$GITHUB_OUTPUT"
