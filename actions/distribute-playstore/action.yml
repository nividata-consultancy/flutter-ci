name: flutter-ci / distribute-playstore
description: >
  Upload an AAB to a Google Play testing track (never production). The app's
  very first upload must be done manually in Play Console.
inputs:
  service-account-json:
    description: PLAY_SERVICE_ACCOUNT_JSON (plain JSON)
    required: true
  package-name:
    description: Android application ID
    required: true
  aab:
    description: Path to the .aab
    required: true
  track:
    description: Testing track (internal, alpha, beta or a custom closed track)
    default: internal
  status:
    description: completed | draft (draft is required while the app itself is still a draft in Play Console)
    default: completed
  release-name:
    description: Release name shown in Play Console
    required: true
  release-notes-file:
    description: Plain-text release notes (truncated to 500 characters)
    default: ""
  mapping-file:
    description: R8 mapping.txt to upload for deobfuscation
    default: ""
  working-directory:
    description: App root (paths are relative to it)
    default: .
runs:
  using: composite
  steps:
    - name: Check inputs
      id: prep
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SA: ${{ inputs.service-account-json }}
        TRACK: ${{ inputs.track }}
        NOTES: ${{ inputs.release-notes-file }}
        LOG_SH: ${{ github.action_path }}/../../scripts/common/log.sh
      run: |
        source "$LOG_SH"
        [[ -n "$SA" ]] || die "PLAY_SERVICE_ACCOUNT_JSON is not set." "SECRETS.md#google-play"
        [[ "$TRACK" != "production" ]] || die "Refusing to upload to the production track." "TAGGING_AND_RELEASES.md#promoting-to-production"
        dir="$RUNNER_TEMP/flutter-ci/whatsnew"
        rm -rf "$dir" && mkdir -p "$dir"
        if [[ -n "$NOTES" && -f "$NOTES" ]]; then
          # Play allows 500 characters per language.
          LC_ALL=C head -c 500 "$NOTES" | iconv -c -f UTF-8 -t UTF-8 >"$dir/whatsnew-en-US" || true
        fi
        echo "whatsnew-dir=$dir" >>"$GITHUB_OUTPUT"

    - name: Upload to Google Play (${{ inputs.track }})
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
      with:
        serviceAccountJsonPlainText: ${{ inputs.service-account-json }}
        packageName: ${{ inputs.package-name }}
        releaseFiles: ${{ inputs.working-directory }}/${{ inputs.aab }}
        releaseName: ${{ inputs.release-name }}
        track: ${{ inputs.track }}
        status: ${{ inputs.status }}
        whatsNewDirectory: ${{ steps.prep.outputs.whatsnew-dir }}
        mappingFile: ${{ inputs.mapping-file != '' && format('{0}/{1}', inputs.working-directory, inputs.mapping-file) || '' }}
